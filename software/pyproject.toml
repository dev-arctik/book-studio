# software/pyproject.toml
# Python packages for Book Studio, installed by uv into the app's own runtime folder on each computer (nothing global).
# Versions match the manual pipeline that made the 13 finished books, so OCR and layout behave the same everywhere.

[project]
name = "book-studio"
version = "0.1.2"
description = "Turns scanned ISKCON books into clean PDFs and EPUBs, fully offline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6-essentials (>=6.12,<6.13)",  # widgets only; the full "pyside6" adds ~400 MB of Qt add-ons we never use
    "surya-ocr (==0.22.1)",
    "typst (==0.15.0)",
    "pymupdf (>=1.28.2,<2.0.0)",
    "opencv-python-headless (==4.11.0.86)",
    "psutil (>=7,<8)",  # battery level, so making books pauses before a laptop runs flat
]

[tool.uv]
package = false
# PyTorch is left out: Surya lists it, but Book Studio's OCR runs in llama-server, and Surya only asks PyTorch which GPU its own
# local models would use — manual/pipeline/no_torch.py answers that instead. PyTorch's unsigned DLLs are blocked by Windows
# Smart App Control, and leaving it out saves ~540 MB per install. (An override that can never apply removes the package.)
override-dependencies = ["torch ; sys_platform == 'never'", "torchvision ; sys_platform == 'never'"]
